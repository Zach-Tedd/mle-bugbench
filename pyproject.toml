[project]
name = "mle-bugbench"
version = "0.1.0"
description = "ML-engineering eval benchmark: realistic tasks with planted bugs, reference solutions, rubrics and automatic graders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zachary Odhiambo" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
# seeding the legacy global RNG is the point of these files
"src/bugbench/seed.py" = ["NPY002"]
"tests/*" = ["NPY002", "PD901"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bugbench --cov-report=term-missing"
